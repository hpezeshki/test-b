# Netlify — static export of the Valisan prototype
[build]
  command = "npm ci && npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# RSC flight payloads must be served as text/x-component or Next's router hard-navigates to the .txt file
[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/x-component; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fallback for unknown routes (existing files always win)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
